<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen Lighting Prototype (3D)</title>
<style>
:root{
  --bg:#0b0e13; --panel:#10141b; --card:#161b24; --line:#222a36; --text:#e8ebf0; --muted:#8a93a3;
  --accent:#ffb454; --accent-ink:#1a1204; --ok:#4cd19a; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;min-height:100dvh}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.tabs{display:flex;gap:6px;margin-left:auto}
.tabs button{background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 16px;min-height:44px;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,1fr);flex:1;min-height:0}
.stage{position:relative;display:flex;align-items:center;justify-content:center;padding:6px;background:radial-gradient(ellipse at 50% 40%,#141a24 0%,#0b0e13 70%)}
.view3d{position:relative;width:100%;height:calc(100dvh - 78px);min-height:420px;border-radius:12px;overflow:hidden}
#scene{position:absolute;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#marks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mk{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;pointer-events:auto;will-change:transform}
.mk .n{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0d1118cc;border:2px solid #ffffff66;font-weight:700;font-size:14px;color:#fff;flex:none}
.mk.on .n{border-color:var(--tc,#fff);box-shadow:0 0 12px var(--tc,#fff)}
.mk.sel .n{background:#fff;color:#111}
.mk .t{background:#0d1118d9;border:1px solid #ffffff30;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap}
.reset{position:absolute;right:14px;top:12px;background:#0d1118cc;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px;font-size:13px}
.hint{position:absolute;left:14px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}
.panel{overflow:auto;padding:14px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px;max-height:calc(100dvh - 63px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.card h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:12px}
.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scene-btn{background:#1d2430;border:1px solid var(--line);border-radius:10px;padding:10px 6px;min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:550}
.scene-btn:active{transform:scale(.97)}
.scene-btn i{width:10px;height:10px;border-radius:50%;display:inline-block}
.zrow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:1px solid transparent;cursor:pointer;min-height:52px}
.zrow[aria-selected=true]{background:#1d2430;border-color:#33405a}
.num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#2a3342;font-weight:700;font-size:13px;flex:none}
.zinfo{flex:1;min-width:0}
.zname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zstate{font-size:12px;color:var(--muted)}
.hold{font-size:10px;background:#3a2a10;color:#ffcf8a;border-radius:6px;padding:1px 6px;margin-left:6px;letter-spacing:.4px}
.swatchdot{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid #ffffff30}
.switch{position:relative;display:inline-block;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:#333c4b;border-radius:99px;transition:.2s}
.switch span:before{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:before{transform:translateX(22px)}
.switch input:focus-visible+span{outline:2px solid #fff;outline-offset:2px}
.ctl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ctl-title{font-weight:650;font-size:16px;display:flex;align-items:center;gap:8px}
.row{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 2px;font-size:13px;color:var(--muted)}
.row output{color:var(--text);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:99px;background:var(--track,#2a3342)}
input[type=range]::-moz-range-track{height:12px;border-radius:99px;background:var(--track,#2a3342)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;margin-top:-9px;border:3px solid #0006;box-shadow:0 1px 4px #0008}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #0006}
.rng-bri{--track:linear-gradient(90deg,#2b3340,#f3f0e8)}
.rng-temp{--track:linear-gradient(90deg,#ff9a3c,#ffd9a8 35%,#fff 60%,#bcd7ff)}
.rng-hue{--track:linear-gradient(90deg,#f00,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#0f131a;border-radius:10px;padding:4px;margin-top:12px}
.seg button{background:transparent;border:0;border-radius:8px;padding:9px;min-height:40px;color:var(--muted)}
.seg button[aria-pressed=true]{background:#2a3342;color:var(--text);font-weight:600}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:10px;margin-top:8px}
.swatches button{aspect-ratio:1;border-radius:14px;border:0;padding:0;position:relative;box-shadow:inset 0 0 0 1px #ffffff22,0 6px 14px -8px var(--sw);transition:transform .15s,box-shadow .15s}
.swatches button:active{transform:scale(.94)}
.swatches button[aria-pressed=true]{box-shadow:0 0 0 2px var(--card),0 0 0 4px #fff,0 8px 18px -6px var(--sw)}
.swatches button[aria-pressed=true]::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:13px;border:solid #111;border-width:0 2.5px 2.5px 0;transform:translate(-50%,-62%) rotate(45deg);opacity:.75}
.row output .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline;box-shadow:0 0 0 1px #ffffff40}
.row.fine{margin-top:14px}
.rng-hue::-webkit-slider-runnable-track{height:8px}
.rng-hue::-moz-range-track{height:8px}
.rng-hue::-webkit-slider-thumb{width:22px;height:22px;margin-top:-7px;border:3px solid #fff;background:#10141b}
.rng-hue::-moz-range-thumb{width:16px;height:16px;border:3px solid #fff;background:#10141b}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:#1d2430;border:1px solid var(--line);border-radius:10px;padding:10px 8px;min-height:44px;text-align:center;font-size:13.5px}
.btn.sm{font-size:12.5px}
.autorow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.log{margin:8px 0 0;padding:0;list-style:none;font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.log li{display:flex;gap:8px;color:#c4cad6}
.log time{color:var(--muted);flex:none}
.log b{flex:none;font-weight:600;color:var(--accent);min-width:64px}
/* scene */
.glow{transition:opacity .45s ease}
.tag{cursor:pointer}
.tag .ring{fill:#0d1118cc;stroke:#ffffff55;stroke-width:2}
.tag.on .ring{stroke:var(--tc,#fff)}
.tag text{font:700 15px system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tag .lbl rect{fill:#0d1118d9;stroke:#ffffff30}
.tag .lbl text{font:600 13px system-ui,sans-serif;text-anchor:start}
.tag.sel .ring{fill:#fff}
.tag.sel>text{fill:#111}
.hit{fill:rgba(0,0,0,0);cursor:pointer;stroke:none}
.hit:hover{stroke:#ffffff80;stroke-width:1.5;stroke-dasharray:5 4}
#scene[data-sel] .hit{stroke:none}
@keyframes dash{to{stroke-dashoffset:-18}}
#scene[data-sel=above] .hit[data-zone=above],#scene[data-sel=under] .hit[data-zone=under],#scene[data-sel=toe] .hit[data-zone=toe],
#scene[data-sel=penin] .hit[data-zone=penin],#scene[data-sel=recessed] .hit[data-zone=recessed],#scene[data-sel=pendant] .hit[data-zone=pendant]{
  stroke:#fff;stroke-width:2;stroke-dasharray:7 5;animation:dash 1.1s linear infinite}
/* house */
.house{padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.house svg{width:100%;max-width:980px;height:auto;max-height:calc(100dvh - 150px)}
.room{fill:#161c26;stroke:#3a4558;stroke-width:2}
.rlabel{font:600 15px system-ui,sans-serif;fill:#aab3c2;text-anchor:middle}
.kitchen-room{cursor:pointer}
[hidden]{display:none!important}
.stage,.panel,.layout>*{min-width:0}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .badge{white-space:normal}
  .panel{border-left:0;border-top:1px solid var(--line);max-height:none}
  .view3d{height:min(112vw,640px);min-height:340px}
  .stage{padding:0}
  .tabs{margin-left:0;width:100%}
  .tabs button{flex:1}
}
@media (max-width:620px){ .mk .t{display:none} .scenes{grid-template-columns:repeat(2,1fr)} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Kitchen Lighting</h1>
    <span class="badge">Design prototype &middot; simulated lights, not connected to Home Assistant</span>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tabK" aria-selected="true">Kitchen 3D</button>
      <button role="tab" id="tabH" aria-selected="false">House 2D</button>
    </nav>
  </header>

  <div class="layout" id="kitchenView">
    <section class="stage">
      <div class="view3d"><div id="scene"></div><div id="marks"></div></div><button class="reset" id="resetView">Reset view</button>
      <div class="hint">Drag to rotate &middot; pinch or scroll to zoom &middot; tap a light or a number</div>
    </section>
    <aside class="panel" id="panel"></aside>
  </div>

  <div class="house" id="houseView" hidden></div>
</div>

<script src="lib/three.min.js"></script><script src="lib/OrbitControls.js"></script><script src="lib/RectAreaLightUniformsLib.js"></script>
<script>
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const clamp=(v,a=0,b=255)=>Math.max(a,Math.min(b,v));
function kToRgb(k){const t=k/100;let r,g,b;
  r=t<=66?255:clamp(329.698727446*Math.pow(t-60,-0.1332047592));
  g=t<=66?clamp(99.4708025861*Math.log(t)-161.1195681661):clamp(288.1221695283*Math.pow(t-60,-0.0755148492));
  b=t>=66?255:(t<=19?0:clamp(138.5177312231*Math.log(t-10)-305.0447927307));
  return [r,g,b].map(Math.round)}
const hexToRgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const rgbToHex=a=>'#'+a.map(v=>v.toString(16).padStart(2,'0')).join('');
function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return rgbToHex([f(0),f(8),f(4)].map(v=>Math.round(v*255)))}
function hexToHue(hex){const [r,g,b]=hexToRgb(hex).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 0;
  let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;return Math.round((h*60+360)%360)}

/* ============ state ============ */
const GOLD='#ffb612';
const ZONES=[
 {id:'above',  n:1,name:'Above cabinets', hw:'Sunricher RGB+CCT controllers, grouped (Zigbee)',type:'rgbcct'},
 {id:'under',  n:2,name:'Under cabinets', hw:'Sunricher RGB+CCT controllers, grouped (Zigbee)',type:'rgbcct'},
 {id:'toe',    n:3,name:'Toe kicks',      hw:'Sunricher RGB+CCT controllers, grouped (Zigbee)',type:'rgbcct'},
 {id:'penin',  n:4,name:'Under peninsula',hw:'Sunricher RGB+CCT controllers, grouped (Zigbee)',type:'rgbcct'},
 {id:'recessed',n:5,name:'Recessed lights',hw:'Tapo S505D dimmers (Matter)',type:'dim'},
 {id:'pendant',n:6,name:'Pendant lights', hw:'Tapo S505D dimmer (Matter)',type:'dim'}];
const Z=Object.fromEntries(ZONES.map(z=>[z.id,z]));
const mk=(on,bri,k=2700,mode='white',color=GOLD)=>({on,bri,k,mode,color,hold:false});
const st={above:mk(true,45,2700),under:mk(true,70,3000),toe:mk(true,30,2700),penin:mk(true,45,2700),recessed:mk(true,55,3000),pendant:mk(true,60,2700)};
let sel='under', paused=false, present=true, tab='k';
const log=[];

const SCENES=[
 {name:'Cooking',dot:'#fff3d6',set:{above:[0],under:[100,4500],toe:[0],penin:[40,3000],recessed:[100,3000],pendant:[100,2700]}},
 {name:'Dinner', dot:'#ffb05a',set:{above:[25,2700],under:[30,2700],toe:[40,2700],penin:[45,2700],recessed:[20,2700],pendant:[60,2700]}},
 {name:'Movie',  dot:'#3b6bff',set:{above:[18,'#ff8a3d'],under:[0],toe:[35,'#2a4dff'],penin:[0],recessed:[0],pendant:[0]}},
 {name:'Steelers',dot:GOLD,set:{above:[100,GOLD],under:[100,5000],toe:[100,GOLD],penin:[60,GOLD],recessed:[100,4000],pendant:[0]}},
 {name:'Night',  dot:'#6d5a3a',set:{above:[0],under:[0],toe:[10,2200],penin:[0],recessed:[0],pendant:[0]}},
 {name:'All off',dot:'#444b58',set:{above:[0],under:[0],toe:[0],penin:[0],recessed:[0],pendant:[0]}}];

function applySet(set,hold){
  for(const [id,v] of Object.entries(set)){const s=st[id],[bri,c]=v;
    if(!bri){s.on=false}else{s.on=true;s.bri=bri;
      if(typeof c==='string'){s.mode='color';s.color=c}else if(typeof c==='number'){s.mode='white';s.k=c}}
    if(hold)s.hold=true}
}
function addLog(src,msg){const d=new Date();log.unshift({t:d.toTimeString().slice(0,5),src,msg});log.length=Math.min(log.length,6)}
function eff(id){const s=st[id];return s.mode==='color'&&Z[id].type==='rgbcct'?hexToRgb(s.color):kToRgb(s.k)}
const inten=id=>st[id].on?Math.pow(st[id].bri/100,0.7):0;

/* ============ real 3D scene (Three.js, units = feet) ============ */
if(THREE.ColorManagement)THREE.ColorManagement.legacyMode=false;
const RW=14,RD=12,RH=9;
const CANS=[[5,4.6],[8.5,4.6],[12,4.6],[5,10.8],[8.8,10.8],[12,8.4]];
const PENDS=[3.4,5,6.6];
let renderer,camera3,controls,scene3;
const Lz={},clickables=[],marks={};
const rnd3=(()=>{let s=5;return()=>(s=(s*16807)%2147483647)/2147483647})();

function ctex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);t.anisotropy=8;return t}
const drawWood=(g,w,h)=>{const rows=4,ph=h/rows;for(let r=0;r<rows;r++){let x=-rnd3()*500;while(x<w){const len=700+rnd3()*800,tone=112+rnd3()*36;
  g.fillStyle=`rgb(${tone+10},${tone-20},${tone-52})`;g.fillRect(x,r*ph,len,ph);
  for(let k=0;k<30;k++){g.strokeStyle=`rgba(55,32,16,${.05+rnd3()*.12})`;g.lineWidth=1+rnd3()*1.6;const yy=r*ph+rnd3()*ph;g.beginPath();g.moveTo(x,yy);g.bezierCurveTo(x+len*.3,yy+(rnd3()-.5)*9,x+len*.7,yy+(rnd3()-.5)*9,x+len,yy);g.stroke()}
  g.strokeStyle='rgba(28,15,7,.6)';g.lineWidth=2.5;g.strokeRect(x,r*ph,len,ph);x+=len}}};
const drawStone=(g,w,h)=>{g.fillStyle='#dcdcdf';g.fillRect(0,0,w,h);
  for(let i=0;i<3200;i++){g.fillStyle=`rgba(${80+rnd3()*60},${85+rnd3()*60},${95+rnd3()*60},.11)`;g.fillRect(rnd3()*w,rnd3()*h,1+rnd3()*2.5,1+rnd3()*2.5)}
  for(let i=0;i<6;i++){g.strokeStyle=`rgba(112,118,130,${.18+rnd3()*.18})`;g.lineWidth=1+rnd3()*2.6;g.beginPath();let x=rnd3()*w,y=rnd3()*h;g.moveTo(x,y);
    g.bezierCurveTo(x+rnd3()*160-80,y+rnd3()*160,x+rnd3()*200-100,y+rnd3()*200,x+rnd3()*240-120,y+rnd3()*260);g.stroke()}};
const drawTile=(g,w,h)=>{g.fillStyle='#bab5aa';g.fillRect(0,0,w,h);const th=64,tw=128;
  for(let r=0;r<h/th;r++)for(let c=-1;c<w/tw+1;c++){const x=c*tw+(r%2?tw/2:0),t=224+rnd3()*8;g.fillStyle=`rgb(${t},${t-3},${t-10})`;g.fillRect(x+2,r*th+2,tw-4,th-4);
    g.fillStyle='rgba(255,255,255,.35)';g.fillRect(x+2,r*th+2,tw-4,3)}};
const drawRug=(g,w,h)=>{g.fillStyle='#33445b';g.fillRect(0,0,w,h);g.strokeStyle='#c9b99a';g.lineWidth=14;g.strokeRect(24,24,w-48,h-48);
  g.fillStyle='#3e526d';g.fillRect(52,52,w-104,h-104);for(let x=70;x<w-60;x+=34){g.fillStyle='#33445b';g.fillRect(x,60,14,h-120)}
  for(let i=0;i<4000;i++){g.fillStyle='rgba(255,255,255,.04)';g.fillRect(rnd3()*w,rnd3()*h,2,2)}};
const drawSky=(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#0b1428');gr.addColorStop(1,'#2a4670');g.fillStyle=gr;g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){g.fillStyle=`rgba(255,255,255,${.3+rnd3()*.6})`;g.fillRect(rnd3()*w,rnd3()*h*.7,1+rnd3()*1.6,1+rnd3()*1.6)}
  const mg=g.createRadialGradient(w*.7,h*.3,4,w*.7,h*.3,70);mg.addColorStop(0,'rgba(230,240,255,.9)');mg.addColorStop(.25,'rgba(190,210,255,.25)');mg.addColorStop(1,'rgba(190,210,255,0)');g.fillStyle=mg;g.fillRect(0,0,w,h);
  g.fillStyle='#eef4ff';g.beginPath();g.arc(w*.7,h*.3,17,0,7);g.fill();
  g.fillStyle='#060b13';for(let i=0;i<7;i++){const x=i*w/6.2,th=70+rnd3()*80;g.beginPath();g.moveTo(x-45,h);g.lineTo(x,h-th);g.lineTo(x+45,h);g.fill()}g.fillRect(0,h-26,w,26)};
const drawClock=(g,w)=>{g.fillStyle='#2b2f36';g.beginPath();g.arc(w/2,w/2,w/2,0,7);g.fill();g.fillStyle='#f1eee6';g.beginPath();g.arc(w/2,w/2,w/2-16,0,7);g.fill();
  g.strokeStyle='#222';g.lineWidth=8;g.lineCap='round';for(let i=0;i<12;i++){const a=i*Math.PI/6,r1=w/2-36,r2=w/2-24;g.beginPath();g.moveTo(w/2+Math.sin(a)*r1,w/2-Math.cos(a)*r1);g.lineTo(w/2+Math.sin(a)*r2,w/2-Math.cos(a)*r2);g.stroke()}

    const dome=new THREE.Mesh(new THREE.SphereGeometry(.55,28,14,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:'#23272f',roughness:.4,metalness:.6,envMap:env,envMapIntensity:.7,side:THREE.DoubleSide}));
    dome.position.set(px,6.0,8.4);add(dome);
    const bulb=new THREE.Mesh(new THREE.SphereGeometry(.17,16,12),emisMat('pendant',2.2));bulb.position.set(px,6.05,8.4);scene3.add(bulb);
    const rim=new THREE.Mesh(new THREE.TorusGeometry(.55,.015,6,32),M('#b08d4a',{metalness:.8,roughness:.35}));rim.rotation.x=Math.PI/2;rim.position.set(px,6.0,8.4);add(rim,false);
    const p=new THREE.PointLight(0xffffff,0,0,2);p.position.set(px,5.85,8.4);p.userData.k=4;scene3.add(p);reg('pendant').lights.push(p);
    proxy('pendant',new THREE.SphereGeometry(.85,12,10),px,6.1,8.4)}
  reg('pendant').anchor.set(5,7.1,8.4);

  /* ---- numbered markers (HTML overlay) ---- */
  for(const z of ZONES){const b=document.createElement('button');b.className='mk';b.dataset.zone=z.id;b.setAttribute('aria-label',z.name);
    b.innerHTML=`<span class="n">${z.n}</span><span class="t">${z.name}</span>`;$('#marks').appendChild(b);marks[z.id]=b}

  /* ---- interaction ---- */
  const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),el=renderer.domElement;let pd=null;
  const hit=e=>{const r=el.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera3);const h=ray.intersectObjects(clickables,false)[0];return h&&h.object.userData.zone};
  el.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY}});
  el.addEventListener('pointerup',e=>{if(!pd)return;const mv=Math.hypot(e.clientX-pd.x,e.clientY-pd.y);pd=null;if(mv>6)return;const z=hit(e);if(z)select(z)});
  el.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||pd)return;el.style.cursor=hit(e)?'pointer':'grab'});
  $('#resetView').onclick=()=>resetView();

  const rs=()=>{const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;renderer.setSize(w,h);camera3.aspect=w/h;camera3.updateProjectionMatrix()};
  window.resize3=rs;new ResizeObserver(rs).observe(host);rs();
  const v=new THREE.Vector3();
  (function tick(){requestAnimationFrame(tick);if(tab!=='k')return;controls.update();renderer.render(scene3,camera3);
    const w=host.clientWidth,h=host.clientHeight;
    for(const z of ZONES){v.copy(Lz[z.id].anchor).project(camera3);const m=marks[z.id];m.style.transform=`translate(${(v.x*.5+.5)*w}px,${(-v.y*.5+.5)*h}px) translate(-15px,-50%)`;m.style.display=v.z<1?'':'none'}})();
}

const _col=new THREE.Color();
function applyLights(){
  for(const z of ZONES){const [r,g,b]=eff(z.id),i=inten(z.id),o=Lz[z.id];if(!o)continue;
    _col.setRGB(r/255,g/255,b/255).convertSRGBToLinear();
    for(const l of o.lights){l.color.copy(_col);l.intensity=l.userData.k*i}
    for(const m of o.emis){m.emissive.copy(_col);m.emissiveIntensity=i*m.userData.k}}
}


/* ============ 2D house ============ */
function buildHouse(){
  const R=(x,y,w,h,label,extra='')=>`<g ${extra}><rect class="room" x="${x}" y="${y}" width="${w}" height="${h}"/><text class="rlabel" x="${x+w/2}" y="${y+h/2+5}">${label}</text></g>`;
  return `<svg viewBox="0 0 800 570" role="img" aria-label="2D house floor plan">
   <rect x="0" y="0" width="800" height="570" fill="#0b0e13"/>
   <defs><radialGradient id="kglow"><stop offset="0" id="kg0" stop-color="#ffb454" stop-opacity=".55"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></radialGradient></defs>
   ${R(40,40,180,200,'Garage')}${R(220,40,80,100,'Laundry')}${R(220,140,80,100,'Pantry')}
   ${R(520,40,240,200,'Dining')}
   ${R(40,240,200,280,'Primary Suite')}${R(240,240,100,140,'Primary Bath')}${R(240,380,100,140,'Bedroom 2')}
   ${R(340,240,100,280,'Hall / Entry')}${R(440,240,320,280,'Living Room')}
   <g class="kitchen-room" id="kitchenRoom" role="button" tabindex="0" aria-label="Kitchen, open 3D view">
     <rect class="room" x="300" y="40" width="220" height="200" style="stroke:#ffb454"/>
     <ellipse id="kglowEl" cx="410" cy="140" rx="150" ry="125" fill="url(#kglow)"/>
     <rect x="330" y="68" width="160" height="26" rx="4" fill="#2a3342"/><rect x="330" y="68" width="26" height="110" rx="4" fill="#2a3342"/><rect x="392" y="160" width="100" height="32" rx="4" fill="#2a3342"/>
     <text class="rlabel" x="410" y="140" style="fill:#e8ebf0;font-size:17px">Kitchen</text>
     <text class="rlabel" x="410" y="162" id="kStatus" style="font-size:12.5px;fill:#ffcf8a"></text>
     <text class="rlabel" x="410" y="222" style="font-size:12px;fill:#8a93a3">Tap to open 3D view</text>
   </g>
   <g transform="translate(390,520)"><rect x="-30" y="-6" width="60" height="12" fill="#161c26"/><circle r="9" fill="#4cd19a"/><text x="0" y="4" text-anchor="middle" style="font:700 10px system-ui;fill:#06150f">R</text></g>
   <text x="425" y="545" style="font:12px system-ui;fill:#8a93a3">Front door &middot; Ring doorbell</text>
   <text x="40" y="28" style="font:12px system-ui;fill:#8a93a3">Placeholder layout &middot; your real floor plan replaces this &middot; view only for now</text>
  </svg>`;
}

/* ============ rendering ============ */
const panel=$('#panel'),houseEl=$('#houseView');
const regProps=()=>{try{for(const z of ZONES)CSS.registerProperty({name:'--c-'+z.id,syntax:'<color>',inherits:true,initialValue:'#fff'})}catch(e){}};
function describe(id){const s=st[id];if(!s.on)return 'Off';
  const bits=[s.bri+'%'];if(Z[id].type==='rgbcct')bits.push(s.mode==='color'?'Color':s.k+'K');return 'On · '+bits.join(' · ')}
function renderScene(){
  if(scene3)applyLights();
  for(const z of ZONES){const m=marks[z.id];if(!m)continue;const [r,g,b]=eff(z.id);
    m.classList.toggle('on',st[z.id].on);m.classList.toggle('sel',sel===z.id);m.style.setProperty('--tc',`rgb(${r},${g},${b})`);
    for(const p of Lz[z.id].proxies)if(p.userData.edge)p.userData.edge.visible=sel===z.id}
  updateHouse();
}function updateHouse(){
  const el=$('#kStatus');if(!el)return;
  const on=ZONES.filter(z=>st[z.id].on);
  el.textContent=(present?'Occupied':'Empty')+' · '+on.length+' of 6 zones on';
  const c=on.length?(()=>{const w=on.reduce((a,z)=>a+inten(z.id),0)||1;const m=[0,0,0];on.forEach(z=>eff(z.id).forEach((v,k)=>m[k]+=v*inten(z.id)/w));return m.map(Math.round)})():[40,48,60];
  $('#kg0').setAttribute('stop-color',`rgb(${c})`);
  const peak=Math.max(0,...ZONES.map(z=>inten(z.id)));$('#kglowEl').style.opacity=(.25+peak*.75).toFixed(2);
}
function listHTML(){
  return ZONES.map(z=>{const s=st[z.id],[r,g,b]=eff(z.id);
    return `<div class="zrow" role="option" data-zone="${z.id}" aria-selected="${sel===z.id}">
      <span class="num">${z.n}</span>
      <div class="zinfo"><div class="zname">${z.name}${s.hold?'<span class="hold">HOLD</span>':''}</div><div class="zstate">${describe(z.id)}</div></div>
      <span class="swatchdot" style="background:${s.on?`rgb(${r},${g},${b})`:'#2a3342'}"></span>
      <label class="switch" onclick="event.stopPropagation()"><input type="checkbox" data-act="rowtoggle" data-zone="${z.id}" aria-label="${z.name} on/off" ${s.on?'checked':''}><span></span></label>
    </div>`}).join('')}
function ctlHTML(){
  const z=Z[sel],s=st[sel];
  let h=`<div class="ctl-head"><div><div class="ctl-title"><span class="num">${z.n}</span>${z.name}</div><div class="muted small">${z.hw}</div></div>
    <label class="switch"><input type="checkbox" data-act="toggle" ${s.on?'checked':''} aria-label="On/off"><span></span></label></div>
    <div class="row"><span>Brightness</span><output id="oBri">${s.bri}%</output></div>
    <input class="rng-bri" type="range" min="1" max="100" value="${s.bri}" data-act="bri" aria-label="Brightness">`;
  if(z.type==='rgbcct'){
    h+=`<div class="seg"><button data-act="mode" data-mode="white" aria-pressed="${s.mode==='white'}">White temperature</button><button data-act="mode" data-mode="color" aria-pressed="${s.mode==='color'}">Color</button></div>`;
    if(s.mode==='white')h+=`<div class="row"><span>Warm &harr; Cool</span><output id="oK">${s.k}K</output></div><input class="rng-temp" type="range" min="2000" max="6500" step="100" value="${s.k}" data-act="temp" aria-label="White temperature">`;
    else{const SW=[['Gold',GOLD],['White','#ffffff'],['Red','#ff3b30'],['Orange','#ff8a3d'],['Green','#30d158'],['Cyan','#32d2ff'],['Blue','#2f5bff'],['Purple','#a35bff'],['Pink','#ff5fa8']],cur=SW.find(x=>x[1]===s.color.toLowerCase());
      h+=`<div class="row"><span>Color</span><output id="oC"><i class="dot" style="background:${s.color}"></i><span id="oCn">${cur?cur[0]:'Custom'}</span></output></div>
      <div class="swatches">${SW.map(([n,c])=>`<button title="${n}" aria-label="${n}" data-act="swatch" data-c="${c}" aria-pressed="${s.color.toLowerCase()===c}" style="background:${c};--sw:${c}"></button>`).join('')}</div>
      <div class="row fine"><span>Fine tune</span></div><input class="rng-hue" type="range" min="0" max="360" value="${hexToHue(s.color)}" data-act="hue" aria-label="Color hue">`}
  }else h+=`<div class="muted small" style="margin-top:10px">Dimmer circuit: on/off and brightness only.</div>`;
  return h}
function autoHTML(){
  const holds=ZONES.filter(z=>st[z.id].hold).map(z=>z.name);
  return `<h2>Automations &amp; overrides</h2>
   <div class="autorow"><div><b>Kitchen presence</b> <span class="muted small">(FP2)</span><div class="muted small">${present?'Someone is in the kitchen':'Kitchen is empty'}</div></div>
     <label class="switch"><input type="checkbox" data-act="presence" ${present?'checked':''} aria-label="Simulate presence"><span></span></label></div>
   <div class="autorow"><div><b>Pause automations</b><div class="muted small">One tap, everything stays as you set it</div></div>
     <label class="switch"><input type="checkbox" data-act="pause" ${paused?'checked':''} aria-label="Pause automations"><span></span></label></div>
   <div class="muted small" style="margin:4px 0 8px">${holds.length?`Manual hold: ${holds.join(', ')}. Automations leave these alone until the kitchen has been empty 10 min or the 2:00 AM reset.`:'No manual holds. Automations control all zones.'}</div>
   <div class="btnrow">
     <button class="btn sm" data-act="ev-wall">Wall switch: recessed</button>
     <button class="btn sm" data-act="ev-alexa">Alexa: &ldquo;Steelers&rdquo;</button>
     <button class="btn sm" data-act="ev-sunset">Schedule: sunset</button>
     <button class="btn sm" data-act="release">Release holds</button>
   </div>
   <ul class="log">${log.map(l=>`<li><time>${l.t}</time><b>${l.src}</b><span>${l.msg}</span></li>`).join('')||'<li class="muted">Changes from any source appear here and update the picture instantly.</li>'}</ul>`}
function renderPanel(){
  panel.innerHTML=`<div class="card"><h2>Scenes</h2><div class="scenes">${SCENES.map(s=>`<button class="scene-btn" data-act="scene" data-name="${s.name}"><i style="background:${s.dot}"></i>${s.name}</button>`).join('')}</div></div>
   <div class="card"><h2>Lighting zones</h2><div id="zlist" role="listbox">${listHTML()}</div></div>
   <div class="card" id="ctl">${ctlHTML()}</div>
   <div class="card" id="auto">${autoHTML()}</div>`}
function refreshAll(){renderScene();$('#zlist').innerHTML=listHTML();$('#ctl').innerHTML=ctlHTML();$('#auto').innerHTML=autoHTML()}
function refreshLive(){renderScene();$('#zlist').innerHTML=listHTML()}

/* ============ actions ============ */
function manual(id,src='Tablet'){const s=st[id];if(!s.hold){s.hold=true}; }
function select(id){sel=id;refreshAll()}
function runPresence(on){
  present=on;
  if(paused){addLog('Automation','Paused: no lighting changes');return}
  if(on){const w={recessed:[55,3000],under:[80,3000],toe:[25,2700]},skipped=[];
    for(const [id,v] of Object.entries(w)){if(st[id].hold){skipped.push(Z[id].name);continue}applySet({[id]:v},false)}
    addLog('FP2','Presence: welcome lighting'+(skipped.length?` (kept ${skipped.join(', ')})`:''))}
  else{ZONES.forEach(z=>{if(!st[z.id].hold)st[z.id].on=false;});
    const had=ZONES.some(z=>st[z.id].hold);ZONES.forEach(z=>st[z.id].hold=false);
    addLog('FP2','Empty 10 min: lights off'+(had?', holds released':''))}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-zone],#kitchenRoom');if(!t)return;
  if(t.id==='kitchenRoom'){setTab('k');return}
  const act=t.dataset.act;
  if(!act&&t.dataset.zone){select(t.dataset.zone);return}
  if(act==='scene'){applySet(SCENES.find(s=>s.name===t.dataset.name).set,true);addLog('Tablet','Scene: '+t.dataset.name);refreshAll()}
  else if(act==='mode'){st[sel].mode=t.dataset.mode;manual(sel);refreshAll()}
  else if(act==='swatch'){st[sel].color=t.dataset.c;st[sel].mode='color';manual(sel);refreshAll()}
  else if(act==='ev-wall'){st.recessed.on=!st.recessed.on;st.recessed.hold=true;addLog('Wall switch','Recessed '+(st.recessed.on?'on':'off'));refreshAll()}
  else if(act==='ev-alexa'){applySet(SCENES.find(s=>s.name==='Steelers').set,true);addLog('Alexa','&ldquo;Turn on Steelers&rdquo;');refreshAll()}
  else if(act==='ev-sunset'){if(paused)addLog('Automation','Paused: sunset schedule skipped');else{
      const sk=[];for(const [id,v] of Object.entries({under:[40,2700],toe:[20,2700]})){if(st[id].hold)sk.push(Z[id].name);else applySet({[id]:v},false)}
      addLog('Schedule','Sunset lighting'+(sk.length?` (kept ${sk.join(', ')})`:''))}refreshAll()}
  else if(act==='release'){ZONES.forEach(z=>st[z.id].hold=false);addLog('Tablet','Manual holds released');refreshAll()}
});
document.addEventListener('change',e=>{
  const a=e.target.dataset.act;if(!a)return;
  if(a==='toggle'){st[sel].on=e.target.checked;manual(sel);addLog('Tablet',Z[sel].name+(st[sel].on?' on':' off'));refreshAll()}
  else if(a==='rowtoggle'){const id=e.target.dataset.zone;st[id].on=e.target.checked;manual(id);addLog('Tablet',Z[id].name+(st[id].on?' on':' off'));refreshAll()}
  else if(a==='presence'){runPresence(e.target.checked);refreshAll()}
  else if(a==='pause'){paused=e.target.checked;addLog('Tablet',paused?'Automations paused':'Automations resumed');refreshAll()}
});
document.addEventListener('input',e=>{
  const a=e.target.dataset.act,v=+e.target.value,s=st[sel];
  if(a==='bri'){s.bri=v;s.on=true;$('#oBri').textContent=v+'%'}
  else if(a==='temp'){s.k=v;s.mode='white';s.on=true;$('#oK').textContent=v+'K'}
  else if(a==='hue'){s.color=hslToHex(v,100,50);s.mode='color';s.on=true;$('#oC .dot').style.background=s.color;$('#oCn').textContent='Custom'}
  else return;
  s.hold=true;refreshLive();
  const cb=$('[data-act=toggle]');if(cb)cb.checked=true;
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.mk,#kitchenRoom')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});

function setTab(t){tab=t;$('#kitchenView').hidden=t!=='k';houseEl.hidden=t!=='h';
  $('#tabK').setAttribute('aria-selected',t==='k');$('#tabH').setAttribute('aria-selected',t==='h');if(t==='h')updateHouse();if(t==='k'&&window.resize3)setTimeout(window.resize3,0)}
$('#tabK').onclick=()=>setTab('k');$('#tabH').onclick=()=>setTab('h');

/* ============ init ============ */
regProps();
init3D();
houseEl.innerHTML=buildHouse();
renderPanel();
renderScene();
{const q=new URLSearchParams(location.search),sc=SCENES.find(s=>s.name.toLowerCase()===(q.get('scene')||'').toLowerCase());
 if(sc){applySet(sc.set,false)}
 if(Z[q.get('zone')])sel=q.get('zone');
 if(sc||q.get('zone'))refreshAll();
 if(q.get('tab')==='house')setTab('h')}
</script>
